<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0D1A2B" />
<title>Treino Upper / Lower</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --navy-900: #0D1A2B;
    --navy-800: #13253B;
    --navy-600: #24466E;
    --gold: #B8935F;
    --gold-soft: #D8BF92;
    --ivory: #F7F3EA;
    --ivory-70: rgba(247, 243, 234, 0.72);
    --ivory-50: rgba(247, 243, 234, 0.6);
    --line: rgba(247, 243, 234, 0.14);
    --pos: #8FBF9F;
    --pos-bg: rgba(143, 191, 159, 0.14);
    --warn: #D8BF92;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
  body {
    margin: 0; background: var(--navy-900); color: var(--ivory);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  button { font-family: inherit; cursor: pointer; border: none; touch-action: manipulation; color: inherit; -webkit-tap-highlight-color: rgba(184, 147, 95, 0.25); }
  input { font-family: inherit; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  :focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  .tnum { font-variant-numeric: tabular-nums; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 64px; }
  .wrap.has-rest { padding-bottom: 120px; }

  .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--gold-soft); font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--gold); }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 36px; line-height: 1.05; margin: 10px 0 6px; letter-spacing: -0.01em; }
  h2 { margin: 0; }
  .sub { color: var(--ivory-70); font-size: 14px; margin: 0; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--navy-800); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ivory-70); flex-shrink: 0; }
  .icon-btn:hover { color: var(--gold-soft); border-color: var(--gold); }

  .next { background: var(--navy-800); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .next .label { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory-50); font-weight: 600; }
  .next .name { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .next .meta { color: var(--ivory-70); font-size: 13px; margin-top: 2px; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .tab { position: relative; padding: 12px 4px; min-height: 48px; border-radius: 12px; background: var(--navy-800); border: 1px solid var(--line); color: var(--ivory-70); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tab[aria-selected="true"] { background: var(--gold); border-color: var(--gold); color: var(--navy-900); }
  .tab.done:not([aria-selected="true"]) { background: var(--pos-bg); border-color: rgba(143,191,159,.4); color: var(--pos); }

  .day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 12px; }
  .tag { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory-50); font-weight: 600; }
  .count { font-size: 14px; font-weight: 600; }
  .bar { height: 6px; background: rgba(247,243,234,.14); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); transition: width .4s ease; }
  .bar.full > div { background: var(--pos); }
  .est { color: var(--ivory-70); font-size: 13px; margin: 8px 0 0; }

  .order { margin: 18px 0 6px; }
  .order .label { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory-50); font-weight: 600; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--navy-800); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { min-height: 44px; border-radius: 9px; background: transparent; color: var(--ivory-70); font-size: 14px; font-weight: 600; }
  .seg button[aria-checked="true"] { background: var(--gold); color: var(--navy-900); }

  .breath { margin: 16px 0; padding: 12px 14px; border-radius: 12px; background: var(--navy-800); border: 1px solid var(--line); color: var(--ivory-70); font-size: 13px; }
  .breath strong { color: var(--gold-soft); font-weight: 600; }

  .block { margin-top: 24px; }
  .block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .block-head h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; font-weight: 600; }
  .block-head .where { color: var(--gold-soft); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .block-note { color: var(--ivory-70); font-size: 13px; margin: -4px 0 12px; }

  .cards > * + * { margin-top: 12px; }
  .card { background: var(--navy-800); border: 1px solid var(--line); border-radius: 14px; padding: 16px; transition: border-color .2s, background .2s; }
  .card.complete { background: rgba(143,191,159,.08); border-color: rgba(143,191,159,.4); }
  .ex-head { display: flex; gap: 12px; align-items: flex-start; }
  .ex-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--navy-900); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--gold-soft); flex-shrink: 0; }
  .ex-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .card.complete .ex-name { color: var(--pos); }
  .ex-meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--ivory-70); }
  .pill { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold-soft); background: var(--navy-900); padding: 2px 8px; border-radius: 999px; }
  .cue { color: var(--ivory-70); font-size: 13px; margin: 8px 0 0; }

  .ex-body { margin-left: 52px; margin-top: 12px; }
  .warm { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 40px; text-align: left; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; font-weight: 500; background: var(--navy-900); border: 1px solid var(--line); color: var(--warn); margin-bottom: 8px; }
  .warm.on { color: var(--pos); border-color: rgba(143,191,159,.4); }
  .warm span.grow { flex: 1; }
  .set-row { display: flex; align-items: center; gap: 8px; }
  .set-row + .set-row { margin-top: 8px; }
  .set-btn { width: 44px; height: 44px; border-radius: 10px; background: var(--navy-900); border: 1px solid var(--line); color: var(--ivory-70); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .set-btn.on { background: var(--pos); border-color: var(--pos); color: var(--navy-900); }
  .load { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .load input { width: 64px; height: 44px; border-radius: 10px; background: var(--navy-900); border: 1px solid var(--line); color: var(--ivory); text-align: center; font-size: 16px; }
  .load input::placeholder { color: var(--ivory-50); }
  .load input:focus { border-color: var(--gold); }
  .load .unit { color: var(--ivory-50); font-size: 12px; }
  .hint { font-size: 11.5px; color: var(--gold-soft); font-weight: 600; line-height: 1.2; }
  .hint small { display: block; color: var(--ivory-50); font-weight: 500; font-size: 11px; }
  .load input.reps { width: 52px; }
  .load .x { color: var(--ivory-50); font-size: 13px; }
  .trend { color: var(--gold-soft); font-size: 13px; margin: 6px 0 0; font-weight: 500; }
  .biset { display: flex; flex-wrap: wrap; gap: 8px 12px; }
  .biset .load input { width: 56px; }
  .part { display: flex; flex-direction: column; font-size: 11px; color: var(--ivory-50); line-height: 1.2; max-width: 80px; }
  .easy { margin-top: 10px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: transparent; border: 1px solid var(--line); color: var(--ivory-70); font-size: 12.5px; font-weight: 600; }
  .easy[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--navy-900); }

  .foot { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .link-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--ivory-70); font-size: 13px; font-weight: 500; padding: 0 8px; border-radius: 8px; }
  .link-btn:hover { color: var(--gold-soft); }
  .done-msg { color: var(--pos); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
  .error { color: var(--warn); font-size: 13px; margin-top: 16px; }

  .rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--navy-800); border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .rest-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .rest .grow { flex: 1; }
  .rest .l { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory-50); font-weight: 600; }
  .rest .t { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .sq { width: 44px; height: 44px; border-radius: 12px; background: var(--navy-900); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }

  .overlay { position: fixed; inset: 0; background: rgba(5, 12, 22, 0.78); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { overscroll-behavior: contain; background: var(--navy-800); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 20px calc(20px) calc(20px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 16px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet-head h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 26px; font-weight: 600; }
  .hist-day + .hist-day { margin-top: 18px; }
  .hist-day .tag { color: var(--gold-soft); margin-bottom: 8px; }
  .hist-li { display: flex; justify-content: space-between; align-items: center; font-size: 14px; background: var(--navy-900); border-radius: 10px; padding: 10px 12px; }
  .hist-li + .hist-li { margin-top: 6px; }
  .hist-li .r { color: var(--pos); font-size: 12px; font-weight: 700; }
  .empty { color: var(--ivory-50); font-size: 14px; margin: 0; }

  .sum { background: var(--navy-900); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .sum .big { font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; font-weight: 600; }
  .sum .d { color: var(--ivory-70); font-size: 13px; margin-bottom: 12px; }
  .sum .row { display: flex; gap: 32px; }
  .sum .k { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory-50); font-weight: 600; margin-bottom: 2px; }
  .sum .v { font-size: 22px; font-weight: 700; }
  .photo-box { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); max-height: 240px; }
  .photo-box img { width: 100%; height: 240px; object-fit: cover; display: block; }
  .photo-empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px 12px; text-align: center; color: var(--ivory-70); font-size: 14px; }
  .btn { width: 100%; min-height: 48px; border-radius: 999px; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
  .btn.gold { background: var(--gold); color: var(--navy-900); }
  .btn.ghost { background: transparent; border: 1px solid var(--gold); color: var(--gold-soft); }
  .btn + .btn { margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .btn + .btn { margin-top: 0; }
  .fld-label { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory-50); font-weight: 600; margin: 0 0 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 380px) { h1 { font-size: 30px; } .ex-body { margin-left: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Armazenamento local (com falha silenciosa) ---------- */
const STORE_KEY = "treino-v4";
const OLD_HISTORY_KEY = "treino-history-v3";
function readStore(key) { try { const r = window.localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function writeStore(key, obj) { try { window.localStorage.setItem(key, JSON.stringify(obj)); return true; } catch (e) { return false; } }

/* ---------- Ícones (SVG inline) ---------- */
const Ic = {
  Check: ({ s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,

  X: ({ s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,

const MuscleIcon = ({ group, size = 20 }) => {

    case "braco": return <svg {...c}><path {...st} d="M6 5c2 1 3 3 3 5 3 0 5-1 7-3M9 10c0 4 2 7 5 9"/></svg>;
    case "quadriceps": return <svg {...c}><path {...st} d="M9 3c-1 4-1 8-2 11-1 2-2 4-1 7h4c0-3 1-5 2-7 1 2 2 4 2 7h4c1-3 0-5-1-7-1-3-1-7-2-11"/></svg>;
    case "posterior": return <svg {...c}><path {...st} d="M12 3v6M7 9c-1 3-1 6 0 9 1 2 2 2 2 3h2c0-2 0-4 1-6 1 2 1 4 1 6h2c0-1 1-1 2-3 1-3 1-6 0-9"/></svg>;

    case "abdomen": return <svg {...c}><rect {...st} x="7" y="4" width="10" height="16" rx="2"/><path {...st} d="M7 9h10M7 14h10M12 4v16"/></svg>;
    default: return <svg {...c}><circle {...st} cx="12" cy="12" r="8"/></svg>;
  }
};
const MUSCLE_LABEL = { peito: "Peito", costas: "Costas", ombro: "Ombro", braco: "Braço", quadriceps: "Quadríceps", posterior: "Posterior de coxa", panturrilha: "Panturrilha", gluteo: "Glúteo", cardio: "Cardio", abdomen: "Abdômen" };
const LOC_LABEL = { casa: "Em casa", academia: "Na academia" };

/* ---------- Plano ----------
   loc: "academia" | "casa". rest: descanso em segundos. noLoad: sem campo de carga.
   mins: duração fixa em minutos (cardio). warmup: séries leves antes do exercício. */
const PLAN = [
  { id: "sup-a", label: "Superior A", short: "Sup A", tag: "Empurrar e puxar", exercises: [
    { id: "supino", loc: "academia", name: "Supino na máquina (ou halteres)", sets: 3, reps: "8-12", muscle: "peito", warmup: 1, rest: 120, cue: "Ombros para trás e para baixo. Desça em 2 segundos." },

    { id: "abd-chao", loc: "casa", name: "Abdominal no chão", sets: 3, reps: "15-20", muscle: "abdomen", warmup: 0, rest: 45, noLoad: true, cue: "Suba devagar, sem puxar o pescoço." },
  ]},
  { id: "inf-a", label: "Inferior A", short: "Inf A", tag: "Perna e cardio", exercises: [
    { id: "leg-press", loc: "academia", name: "Leg press", sets: 3, reps: "8-12", muscle: "quadriceps", warmup: 1, rest: 120, cue: "Lombar colada no banco. Não trave os joelhos no topo." },
    { id: "mesa-flexora", loc: "academia", name: "Mesa flexora", sets: 3, reps: "8-12", muscle: "posterior", warmup: 0, rest: 90, cue: "Quadril colado no banco. Volte devagar." },
    { id: "extensora", loc: "academia", name: "Cadeira extensora", sets: 3, reps: "8-12", muscle: "quadriceps", warmup: 0, rest: 75, cue: "Segure 1 segundo no topo." },

/* aquecimento: 1 série leve no primeiro exercício de cada grupo muscular do dia */
PLAN.forEach((day) => {
  const seen = {};
  day.exercises.forEach((ex) => { ex.warmup = (!ex.noLoad && !seen[ex.muscle]) ? 1 : 0; seen[ex.muscle] = true; });
});

/* ---------- Funções auxiliares ---------- */
function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function formatDate(iso) { return new Date(iso + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }); }
function formatClock(sec) { const m = Math.floor(sec / 60); return `${m}:${String(sec % 60).padStart(2, "0")}`; }
function fmtKg(n) { return String(n).replace(".", ","); }
function fmtRest(s) {
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60), r = s % 60;
  return r ? `${m} min ${r} s` : `${m} min`;
}
function toNum(v) { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; }

const checkKey = (dayId, exId, setIdx) => `${dayId}|${exId}|s${setIdx}`;
const warmKey = (dayId, exId, i) => `${dayId}|${exId}|w${i}`;
const loadKey = (dayId, exId, setIdx, part) => `${dayId}|${exId}|${setIdx}${part === undefined ? "" : "|b" + part}`;
const lastKey = (exId, setIdx, part) => `${exId}|${setIdx}${part === undefined ? "" : "|b" + part}`;

function repRange(ex) {
  const m = /(\d+)\s*-\s*(\d+)/.exec(ex.reps || "");
  return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : [8, 12];
}
function stepFor(load) { return load < 20 ? 1 : load < 60 ? 2.5 : 5; }
/* dupla progressão: bateu o topo da faixa na série mais pesada, sobe; abaixo do piso, reduz; no meio, mantém */
function exVerdict(ex, lastLoads, lastReps) {
  if (ex.noLoad || ex.biset) return null;
  const [lo, hi] = repRange(ex);
  let top = null;
  for (let i = 0; i < ex.sets; i++) {
    const L = toNum(lastLoads[lastKey(ex.id, i)]);
    const R = toNum(lastReps[lastKey(ex.id, i)]);
    if (L == null || R == null) continue;
    if (!top || L >= top.L) top = { L, R };
  }
  if (!top) return null;
  const action = top.R >= hi ? "subir" : top.R < lo ? "diminuir" : "manter";
  return { action, lo, hi, ...top };
}
function targetLoad(verdict, last) {
  const L = toNum(last);
  if (L == null || !verdict) return null;
  const st = stepFor(L);
  if (verdict.action === "subir") return Math.round((L + st) * 2) / 2;
  if (verdict.action === "diminuir") return Math.max(0, Math.round((L - st) * 2) / 2);
  return L;
}

function dayStats(day, checked) {
  let total = 0, done = 0;
  day.exercises.forEach((ex) => {
    total += ex.sets;
    for (let s = 0; s < ex.sets; s++) if (checked[checkKey(day.id, ex.id, s)]) done++;
  });
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function estimateMinutes(day) {
  let m = 0;
  day.exercises.forEach((ex) => {
    if (ex.mins) m += ex.mins;
    else m += ex.sets * (ex.rest / 60 + 0.75) + (ex.warmup || 0) * 1.2;
  });
  return Math.round(m / 5) * 5;
}
function phaseInfo(today) {
  if (today <= "2026-11-01") return { n: 1, text: "Fase 1 · 2 a 3 dias por semana · 3 a 4 repetições de folga" };
  if (today <= "2026-11-14") return { n: 2, text: "Fase 2 · 4 dias por semana · 3 a 4 repetições de folga" };
  return { n: 3, text: "Fase 3 · 4 dias por semana · 2 repetições de folga" };
}
function nextDayIndex(history) {
  let best = null;
  PLAN.forEach((d, i) => (history[d.id] || []).forEach((e) => {
    const at = e.at || Date.parse(e.date + "T12:00:00");
    if (!best || at >= best.at) best = { at, i };
  }));
  return best ? (best.i + 1) % PLAN.length : 0;
}
function groupBlocks(day, first) {
  const order = first === "casa" ? ["casa", "academia"] : ["academia", "casa"];
  return order
    .map((loc) => ({ loc, items: day.exercises.filter((e) => e.loc === loc) }))
    .filter((b) => b.items.length > 0);
}

/* ---------- App ---------- */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [data, setData] = useState({ checked: {}, loads: {}, reps: {}, easy: {}, sessions: {} });
  const [history, setHistory] = useState({});
  const [lastLoads, setLastLoads] = useState({});
  const [lastReps, setLastReps] = useState({});
  const [lastEasy, setLastEasy] = useState({});
  const [settings, setSettings] = useState({ first: "academia" });
  const [activeDay, setActiveDay] = useState(0);
  const [saveError, setSaveError] = useState(false);

  const [showHistory, setShowHistory] = useState(false);
  const [showSummary, setShowSummary] = useState(false);
  const [photo, setPhoto] = useState(null);
  const [rest, setRest] = useState(null); // { end, label } ou { paused: ms, label }
  const [now, setNow] = useState(Date.now());
  const canvasRef = useRef(null);
  const fileRef = useRef(null);
  const camRef = useRef(null);
  const today = todayStr();

  /* carregar */
  useEffect(() => {
    const saved = readStore(STORE_KEY);
    let hist = {};
    if (saved) {
      const d = saved.data || {};
      const sessions = d.sessions || {};
      const clean = { checked: d.checked || {}, loads: d.loads || {}, reps: d.reps || {}, easy: d.easy || {}, sessions: { ...sessions } };
      // descarta sessões de dias anteriores que ficaram abertas
      Object.keys(sessions).forEach((dayId) => {
        if (sessions[dayId].startedOn !== todayStr()) {
          ["checked", "loads", "reps", "easy"].forEach((k) => Object.keys(clean[k]).forEach((key) => { if (key.startsWith(dayId + "|")) delete clean[k][key]; }));
          delete clean.sessions[dayId];
        }
      });
      setData(clean);
      hist = saved.history || {};
      setLastLoads(saved.lastLoads || {});
      setLastReps(saved.lastReps || {});
      setLastEasy(saved.lastEasy || {});
      if (saved.settings) setSettings(saved.settings);
    } else {
      // migra apenas o histórico de sessões da v3 (cargas mudam com a nova lista de exercícios)
      const old = readStore(OLD_HISTORY_KEY);
      if (old && typeof old === "object") hist = old;
    }
    setHistory(hist);
    setActiveDay(nextDayIndex(hist));
    setLoaded(true);
  }, []);

  /* salvar */
  useEffect(() => {
    if (!loaded) return;
    setSaveError(!writeStore(STORE_KEY, { v: 4, data, history, lastLoads, lastReps, lastEasy, settings }));
  }, [loaded, data, history, lastLoads, lastReps, lastEasy, settings]);

  /* cronômetro de descanso (baseado em horário, não perde tempo em segundo plano) */
  useEffect(() => {
    if (!rest || rest.paused != null) return;
    const id = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(id);
  }, [rest]);
  useEffect(() => {
    if (rest && rest.paused == null && now >= rest.end) {
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
      setRest(null);
    }
  }, [now, rest]);
  const restLeft = rest ? Math.max(0, Math.ceil(((rest.paused != null ? rest.paused : rest.end - now)) / 1000)) : 0;

  const startRest = (seconds, label) => {
    if (!seconds) { setRest(null); return; }
    setNow(Date.now());
    setRest({ end: Date.now() + seconds * 1000, label });
  };
  const toggleRestPause = () => {
    if (!rest) return;
    if (rest.paused != null) setRest({ end: Date.now() + rest.paused, label: rest.label });
    else setRest({ paused: Math.max(0, rest.end - Date.now()), label: rest.label });
  };

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") setShowHistory(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const day = PLAN[activeDay];
  const stats = dayStats(day, data.checked);
  const session = data.sessions[day.id];
  const finishedToday = (history[day.id] || []).some((e) => e.date === today);
  const nextIdx = nextDayIndex(history);
  const phase = phaseInfo(today);

  const toggleSet = (ex, setIdx) => {
    const key = checkKey(day.id, ex.id, setIdx);
    const was = !!data.checked[key];
    const sessions = { ...data.sessions };
    if (!was && !sessions[day.id]) sessions[day.id] = { startedOn: today, start: Date.now(), end: null };
    setData({ ...data, checked: { ...data.checked, [key]: !was }, sessions });
    if (!was) startRest(ex.rest, ex.name);
  };
  const toggleWarm = (ex, i) => {
    const key = warmKey(day.id, ex.id, i);
    setData({ ...data, checked: { ...data.checked, [key]: !data.checked[key] } });
  };
  const setLoad = (key, value) => setData({ ...data, loads: { ...data.loads, [key]: value } });
  const setReps = (key, value) => setData({ ...data, reps: { ...data.reps, [key]: value } });
  const toggleEasy = (ex) => setData({ ...data, easy: { ...data.easy, [ex.id]: !data.easy[ex.id] } });

  const clearDay = (dayId, base) => {
    const next = { checked: { ...base.checked }, loads: { ...base.loads }, reps: { ...base.reps }, easy: { ...base.easy }, sessions: { ...base.sessions } };
    ["checked", "loads", "reps", "easy"].forEach((k) => Object.keys(next[k]).forEach((key) => { if (key.startsWith(dayId + "|")) delete next[k][key]; }));
    PLAN.find((d) => d.id === dayId).exercises.forEach((ex) => delete next.easy[ex.id]);
    delete next.sessions[dayId];
    return next;
  };
  const resetDay = () => {
    if (!window.confirm("Apagar as séries e cargas de hoje neste treino?")) return;
    setData(clearDay(day.id, data));
    setRest(null);
  };

  /* concluir treino automaticamente ao chegar em 100% */
  useEffect(() => {
    if (!loaded || stats.pct !== 100 || !session || session.end) return;
    const end = Date.now();
    const durationSeconds = Math.round((end - session.start) / 1000);
    setHistory((prev) => {
      const list = (prev[day.id] || []).filter((e) => e.date !== today);
      return { ...prev, [day.id]: [...list, { date: today, at: end, doneSets: stats.done, totalSets: stats.total, durationSeconds }].slice(-20) };
    });
    const nl = { ...lastLoads };
    Object.keys(data.loads).forEach((key) => {
      if (key.startsWith(day.id + "|") && data.loads[key]) nl[key.slice(day.id.length + 1)] = data.loads[key];
    });
    setLastLoads(nl);
    const nr = { ...lastReps };
    Object.keys(data.reps).forEach((key) => {
      if (key.startsWith(day.id + "|") && data.reps[key]) nr[key.slice(day.id.length + 1)] = data.reps[key];
    });
    setLastReps(nr);
    const ne = { ...lastEasy };
    day.exercises.forEach((ex) => { if (data.easy[ex.id] !== undefined) ne[ex.id] = !!data.easy[ex.id]; });
    setLastEasy(ne);
    setData({ ...data, sessions: { ...data.sessions, [day.id]: { ...session, end } } });
    setRest(null);
    setShowSummary(true);
    // eslint-disable-next-line
  }, [stats.pct, loaded, session]);

  const closeSummary = () => {
    setData(clearDay(day.id, data));
    setPhoto(null);
    setShowSummary(false);
    setActiveDay(nextDayIndex(history));
    window.scrollTo({ top: 0 });
  };

  const onPhoto = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => setPhoto(r.result);
    r.readAsDataURL(file);
  };

  const summaryDuration = session && session.end ? Math.round((session.end - session.start) / 1000) : null;

  /* imagem para o Gym Rats: foto + informações do treino (4:5 ou 9:16) */
  const makeStory = async () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = 1080, H = settings.fmt === "9x16" ? 1920 : 1350;
    canvas.width = W; canvas.height = H;
    try { await document.fonts.load('700 80px "Cormorant Garamond"'); await document.fonts.load('600 30px "Inter"'); } catch (e) {}
    const exCount = day.exercises.filter((e) => e.muscle !== "cardio").length;
    const muscles = Array.from(new Set(day.exercises.map((e) => MUSCLE_LABEL[e.muscle]))).join(" · ");
    const paint = () => {
      const g = ctx.createLinearGradient(0, H * 0.4, 0, H);
      g.addColorStop(0, "rgba(13,26,43,0)");
      g.addColorStop(1, "rgba(13,26,43,0.97)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(216,191,146,0.45)"; ctx.lineWidth = 2; ctx.strokeRect(36, 36, W - 72, H - 72);
      ctx.textBaseline = "top";
      ctx.fillStyle = "#D8BF92"; ctx.font = '600 28px "Inter", sans-serif';
      ctx.fillText("TREINO CONCLUÍDO", 80, 84);
      let y = H - 400;
      ctx.fillStyle = "#F7F3EA"; ctx.font = '700 92px "Cormorant Garamond", Georgia, serif';
      ctx.fillText(day.label, 80, y);
      y += 112;
      ctx.fillStyle = "#D8BF92"; ctx.font = '500 34px "Inter", sans-serif';
      ctx.fillText(new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" }), 80, y);
      y += 50;
      ctx.fillStyle = "rgba(247,243,234,0.8)"; ctx.font = '400 28px "Inter", sans-serif';
      ctx.fillText(muscles, 80, y);
      y += 62;
      ctx.strokeStyle = "rgba(247,243,234,0.25)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(80, y); ctx.lineTo(W - 80, y); ctx.stroke();
      y += 28;
      const cols = [80, 80 + 300, 80 + 600];
      ctx.fillStyle = "rgba(247,243,234,0.6)"; ctx.font = '600 24px "Inter", sans-serif';
      ctx.fillText("DURAÇÃO", cols[0], y); ctx.fillText("SÉRIES", cols[1], y); ctx.fillText("EXERCÍCIOS", cols[2], y);
      y += 38;
      ctx.fillStyle = "#F7F3EA"; ctx.font = '700 60px "Inter", sans-serif';
      ctx.fillText(summaryDuration ? formatClock(summaryDuration) : "--:--", cols[0], y);
      ctx.fillText(`${stats.done}/${stats.total}`, cols[1], y);
      ctx.fillText(String(exCount), cols[2], y);
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const name = `treino-${day.id}-${today}.png`;
        try {
          const file = new File([blob], name, { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "Treino concluído" });
            return;
          }
        } catch (e) { if (e && e.name === "AbortError") return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.download = name; a.href = url; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }, "image/png");
    };
    ctx.fillStyle = "#0D1A2B"; ctx.fillRect(0, 0, W, H);
    if (photo) {
      const img = new Image();
      img.onload = () => {
        const ir = img.width / img.height, cr = W / H;
        let dw, dh, dx, dy;
        if (ir > cr) { dh = H; dw = H * ir; dx = (W - dw) / 2; dy = 0; } else { dw = W; dh = W / ir; dx = 0; dy = (H - dh) / 2; }
        ctx.drawImage(img, dx, dy, dw, dh);
        paint();
      };
      img.src = photo;
    } else paint();
  };

  const blocks = groupBlocks(day, settings.first);
  const hasBoth = blocks.length > 1;

  const renderExercise = (ex) => {
    const exDone = Array.from({ length: ex.sets }).filter((_, s) => data.checked[checkKey(day.id, ex.id, s)]).length;
    const complete = exDone === ex.sets;
    const showLoad = !ex.noLoad;
    const verdict = exVerdict(ex, lastLoads, lastReps);
    const easySuggest = (key) => {
      const last = toNum(lastLoads[key]);
      if (last == null || !lastEasy[ex.id]) return null;
      return Math.round(last * 1.05 * 2) / 2;
    };
    const warmKg = !ex.biset && lastLoads[lastKey(ex.id, 0)] ? Math.round(toNum(lastLoads[lastKey(ex.id, 0)]) * 0.6 * 2) / 2 : null;
    const trend = verdict && (
      verdict.action === "subir" ? `Na última vez, a série mais pesada fez ${verdict.R} repetições. Hoje suba a carga.`
      : verdict.action === "diminuir" ? `Na última vez, a série mais pesada ficou em ${verdict.R} repetições, abaixo de ${verdict.lo}. Hoje reduza um pouco a carga.`
      : `Na última vez, a série mais pesada fez ${verdict.R} repetições. Mantenha a carga e tente chegar a ${verdict.hi}.`);
    return (
      <div key={ex.id} className={"card" + (complete ? " complete" : "")}>
        <div className="ex-head">
          <div className="ex-icon"><MuscleIcon group={ex.muscle} /></div>
          <div>
            <div className="ex-name">{ex.name}</div>
            <div className="ex-meta">
              <span className="tnum">{ex.sets > 1 || !ex.mins ? `${ex.sets}x ${ex.reps}` : ex.reps}</span>
              <span className="pill">{MUSCLE_LABEL[ex.muscle]}</span>
              {ex.rest > 0 && <span className="tnum">descanso {fmtRest(ex.rest)}</span>}
            </div>
          </div>
        </div>
        {ex.cue && <p className="cue" style={{ marginLeft: 52 }}>{ex.cue}</p>}
        {trend && <p className="trend" style={{ marginLeft: 52 }}>{trend}</p>}

        <div className="ex-body">
          {Array.from({ length: ex.warmup || 0 }).map((_, i) => {
            const on = !!data.checked[warmKey(day.id, ex.id, i)];
            return (
              <button key={i} className={"warm" + (on ? " on" : "")} aria-pressed={on} onClick={() => toggleWarm(ex, i)}>
                <Ic.Heat />
                <span className="grow">Aquecimento: 1 série leve{warmKg != null ? `, cerca de ${fmtKg(warmKg)} kg` : ""}, 10 a 12 repetições</span>
                {on && <Ic.Check s={14} />}
              </button>
            );
          })}

          {Array.from({ length: ex.sets }).map((_, setIdx) => {
            const on = !!data.checked[checkKey(day.id, ex.id, setIdx)];
            return (
              <div key={setIdx} className="set-row">
                <button className={"set-btn tnum" + (on ? " on" : "")} aria-pressed={on}
                  aria-label={`Série ${setIdx + 1} de ${ex.name}, ${on ? "concluída" : "pendente"}`}
                  onClick={() => toggleSet(ex, setIdx)}>
                  {on ? <Ic.Check s={18} /> : setIdx + 1}
                </button>
                {showLoad && (ex.biset ? (
                  <div className="biset">
                    {ex.biset.map((part, pi) => {
                      const lk = lastKey(ex.id, setIdx, pi);
                      const sug = easySuggest(lk);
                      return (
                        <div key={pi} className="load">
                          <input type="number" inputMode="decimal" placeholder="kg" name={`carga-${ex.id}-${setIdx}-${pi}`} autoComplete="off" aria-label={`Carga de ${part}, série ${setIdx + 1}, em quilos`}
                            value={data.loads[loadKey(day.id, ex.id, setIdx, pi)] || ""}
                            onChange={(e) => setLoad(loadKey(day.id, ex.id, setIdx, pi), e.target.value)} />
                          <div className="part">
                            <span>{part}</span>
                            {lastLoads[lk] && <span className="hint">últ. {fmtKg(lastLoads[lk])} kg</span>}
                            {sug != null && <span className="hint">tente {fmtKg(sug)} kg</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (() => {
                  const lk = lastKey(ex.id, setIdx);
                  const goal = targetLoad(verdict, lastLoads[lk]);
                  return (
                    <div className="load">
                      <input type="number" inputMode="decimal" placeholder="kg" name={`carga-${ex.id}-${setIdx}`} autoComplete="off" aria-label={`Carga da série ${setIdx + 1} de ${ex.name}, em quilos`}
                        value={data.loads[loadKey(day.id, ex.id, setIdx)] || ""}
                        onChange={(e) => setLoad(loadKey(day.id, ex.id, setIdx), e.target.value)} />
                      <span className="x" aria-hidden="true">x</span>
                      <input className="reps" type="number" inputMode="numeric" placeholder="rep" name={`reps-${ex.id}-${setIdx}`} autoComplete="off" aria-label={`Repetições da série ${setIdx + 1} de ${ex.name}`}
                        value={data.reps[loadKey(day.id, ex.id, setIdx)] || ""}
                        onChange={(e) => setReps(loadKey(day.id, ex.id, setIdx), e.target.value)} />
                      {lastLoads[lk] && (
                        <span className="hint">últ. {fmtKg(lastLoads[lk])}{lastReps[lk] ? `x${lastReps[lk]}` : " kg"}{goal != null && <small>tente {fmtKg(goal)} kg</small>}</span>
                      )}
                    </div>
                  );
                })())}
              </div>
            );
          })}

          {showLoad && ex.biset && complete && (
            <button className="easy" aria-pressed={!!data.easy[ex.id]} onClick={() => toggleEasy(ex)}>
              {data.easy[ex.id] ? "Marcado: foi leve, sobe na próxima" : "Foi leve? Marque para subir a carga"}
            </button>
          )}
        </div>
      </div>
    );
  };

  return (
    <div className={"wrap" + (rest ? " has-rest" : "")}>
      <header className="top">
        <div>
          <div className="eyebrow">Ciclo de emagrecimento</div>
          <h1>Upper / Lower</h1>
          <p className="sub">{phase.text}</p>
        </div>
        <button className="icon-btn" onClick={() => setShowHistory(true)} aria-label="Ver histórico de sessões"><Ic.History /></button>
      </header>

      <section className="next" aria-label="Próximo treino sugerido">
        <div className="label">{finishedToday ? "Hoje você já treinou" : "Próximo treino sugerido"}</div>
        <div className="name">{PLAN[nextIdx].label}</div>
        <div className="meta">{PLAN[nextIdx].tag} · cerca de {estimateMinutes(PLAN[nextIdx])} min</div>
      </section>

      <nav className="tabs" role="tablist" aria-label="Dias de treino">
        {PLAN.map((d, i) => {
          const doneToday = (history[d.id] || []).some((e) => e.date === today);
          return (
            <button key={d.id} role="tab" aria-selected={i === activeDay}
              className={"tab" + (doneToday ? " done" : "")} onClick={() => setActiveDay(i)}>
              {doneToday && <Ic.Check s={12} />}{d.short}
            </button>
          );
        })}
      </nav>

      <section aria-label={day.label}>
        <div className="day-head">
          <span className="tag">{day.label} · {day.tag}</span>
          <span className="count tnum" style={{ color: stats.pct === 100 ? "var(--pos)" : "var(--ivory)" }}>{stats.done}/{stats.total} séries</span>
        </div>
        <div className={"bar" + (stats.pct === 100 ? " full" : "")} role="progressbar" aria-valuenow={stats.pct} aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do treino">
          <div style={{ width: `${stats.pct}%` }} />
        </div>
        <p className="est">Cerca de {estimateMinutes(day)} min no total.
          {history[day.id] && history[day.id].length > 0 && ` Última vez: ${formatDate(history[day.id][history[day.id].length - 1].date)}.`}</p>
      </section>

      {hasBoth && (
        <div className="order" role="radiogroup" aria-label="Começar por">
          <div className="label">Começar por</div>
          <div className="seg">
            {["academia", "casa"].map((loc) => (
              <button key={loc} role="radio" aria-checked={settings.first === loc} onClick={() => setSettings({ ...settings, first: loc })}>
                {loc === "academia" ? "Academia" : "Casa"}
              </button>
            ))}
          </div>
        </div>
      )}

      <p className="breath"><strong>Carga:</strong> pode subir a cada série (aquecimento leve, depois sobe). Meta de 8 a 12 repetições. Fez 12 na série mais pesada: sobe na próxima vez. Ficou abaixo de 8: reduza. Entre 8 e 11: mantenha a carga e tente fazer mais uma repetição.</p>
      <p className="breath"><strong>Respiração:</strong> expire no esforço e não prenda o ar. Se der dor de cabeça forte, tontura, dor no peito ou falta de ar fora do normal, pare o treino.</p>

      {blocks.map((b, bi) => (
        <section key={b.loc} className="block" aria-label={LOC_LABEL[b.loc]}>
          <div className="block-head">
            <h2>{bi === 0 ? LOC_LABEL[b.loc] : `Depois, ${LOC_LABEL[b.loc].toLowerCase()}`}</h2>
            <span className="where tnum">{b.items.length} {b.items.length === 1 ? "exercício" : "exercícios"}</span>
          </div>
          {bi > 0 && <p className="block-note">{b.loc === "casa" ? "Termine em casa, sem pressa." : "Agora desça para a academia."}</p>}
          <div className="cards">{b.items.map(renderExercise)}</div>
        </section>
      ))}

      <div className="foot">
        <button className="link-btn" onClick={resetDay}><Ic.Reset /> Reiniciar treino de hoje</button>
        {finishedToday && <div className="done-msg"><Ic.Check s={14} /> Feito hoje</div>}
      </div>

      {saveError && <p className="error" role="alert">Não consegui salvar neste navegador. O progresso pode se perder se você fechar a página.</p>}
      {!loaded && <p className="sub" style={{ marginTop: 16 }}>Carregando…</p>}

      {rest && (
        <div className="rest" role="timer" aria-label="Descanso">
          <div className="rest-in">
            <div className="grow">
              <div className="l">Descanso · {rest.label}</div>
              <div className="t tnum">{formatClock(restLeft)}</div>
            </div>
            <button className="sq" onClick={toggleRestPause} aria-label={rest.paused != null ? "Retomar descanso" : "Pausar descanso"}>
              {rest.paused != null ? <Ic.Play /> : <Ic.Pause />}
            </button>
            <button className="sq" onClick={() => setRest(null)} aria-label="Fechar descanso"><Ic.X /></button>
          </div>
        </div>
      )}

      {showHistory && (
        <div className="overlay" onClick={() => setShowHistory(false)}>
          <div className="sheet" role="dialog" aria-modal="true" aria-label="Histórico de sessões" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-head">
              <h2>Histórico de sessões</h2>
              <button className="icon-btn" onClick={() => setShowHistory(false)} aria-label="Fechar histórico"><Ic.X /></button>
            </div>
            {PLAN.map((d) => {
              const list = (history[d.id] || []).slice().reverse();
              return (
                <div key={d.id} className="hist-day">
                  <div className="tag">{d.label}</div>
                  {list.length === 0 ? <p className="empty">Nenhuma sessão registrada ainda.</p> : list.map((e, i) => (
                    <div key={i} className="hist-li">
                      <span>{formatDate(e.date)}{e.durationSeconds ? ` · ${formatClock(e.durationSeconds)}` : ""}</span>
                      <span className="r tnum">{e.doneSets}/{e.totalSets} séries</span>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showSummary && (
        <div className="overlay">
          <div className="sheet" role="dialog" aria-modal="true" aria-label="Treino concluído">
            <div className="sheet-head">
              <h2>Treino concluído</h2>
              <button className="icon-btn" onClick={closeSummary} aria-label="Fechar resumo"><Ic.X /></button>
            </div>
            <div className="sum">
              <div className="big">{day.label}</div>
              <div className="d">{new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" })}</div>
              <div className="row">
                <div><div className="k">Duração</div><div className="v tnum">{summaryDuration ? formatClock(summaryDuration) : "--:--"}</div></div>
                <div><div className="k">Séries</div><div className="v tnum">{stats.done}/{stats.total}</div></div>
              </div>
            </div>
            <p className="fld-label">Foto do treino (para o Gym Rats)</p>
            {photo ? <div className="photo-box"><img src={photo} alt="Foto do treino" width="600" height="240" /></div> : <div className="photo-empty">Tire uma foto agora ou escolha da galeria. Sem foto, a imagem sai só com as informações.</div>}
            <input ref={camRef} type="file" accept="image/*" capture="environment" className="sr" tabIndex={-1} onChange={onPhoto} onClick={(e) => { e.target.value = null; }} />
            <input ref={fileRef} type="file" accept="image/*" className="sr" tabIndex={-1} onChange={onPhoto} onClick={(e) => { e.target.value = null; }} />
            <div className="two" style={{ marginTop: 12 }}>
              <button className="btn ghost" onClick={() => camRef.current && camRef.current.click()}>Tirar foto</button>
              <button className="btn ghost" onClick={() => fileRef.current && fileRef.current.click()}>Da galeria</button>
            </div>
            <p className="fld-label" style={{ marginTop: 16 }}>Formato</p>
            <div className="seg" role="radiogroup" aria-label="Formato da imagem">
              {[["4x5", "Feed 4:5"], ["9x16", "Stories 9:16"]].map(([k, l]) => (
                <button key={k} role="radio" aria-checked={(settings.fmt || "4x5") === k} onClick={() => setSettings({ ...settings, fmt: k })}>{l}</button>
              ))}
            </div>
            <div style={{ marginTop: 16 }}>
              <button className="btn gold" onClick={makeStory}>Salvar ou compartilhar imagem</button>
              <button className="btn ghost" onClick={closeSummary}>Concluir e ir para o próximo treino</button>
            </div>
          </div>
        </div>
      )}

      <canvas ref={canvasRef} style={{ display: "none" }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
